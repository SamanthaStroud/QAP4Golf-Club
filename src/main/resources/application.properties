spring.application.name=golf-club-qap

# Local / Docker default datasource
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:golfclub}
spring.datasource.username=${DB_USERNAME:golfuser}
spring.datasource.password=${DB_PASSWORD:golfpass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

